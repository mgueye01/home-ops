---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-seo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: open-seo-secret
    template:
      data:
        # base64("email:api_password") from the DataForSEO dashboard
        DATAFORSEO_API_KEY: "{{ .DATAFORSEO_API_KEY }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
        # OAuth Web client for Search Console + GA4 (redirect URIs:
        # https://seo.g-eye.io/api/gsc/oauth/callback and /api/ga4/oauth/callback)
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
        # Encrypts stored Google tokens; changing it invalidates connections
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
  dataFrom:
    - extract:
        key: open-seo
