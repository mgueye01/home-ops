---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-seo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      *app :
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/every-app/open-seo
              tag: v0.1.12
            env:
              PORT: &port 3001
              ALLOWED_HOST: seo.g-eye.io
              # No in-app auth: every visitor is admin@localhost. Internal gateway only.
              AUTH_MODE: local_noauth
              CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
              OPENSEO_TELEMETRY_DISABLED: "1"
              VITE_SHOW_DEVTOOLS: "false"
            envFrom:
              - secretRef:
                  name: open-seo-secret
            probes:
              # Container runs migrations + a full vite build on every start before serving
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                # Boot-time build runs with --max-old-space-size=4096
                memory: 6Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            conditions: ["len([BODY]) == 0"]
            dns:
              query-name: seo.g-eye.io
              query-type: A
            url: 1.1.1.1
        hostnames:
          - seo.g-eye.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      # Local D1 (SQLite) state lives under .wrangler
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/.wrangler
