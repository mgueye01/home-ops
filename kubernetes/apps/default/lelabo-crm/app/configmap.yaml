---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lelabo-crm-v243-frontend-patch
data:
  frontend-bootstrap.js: |
    // Work around Twenty v2.43.0 registering its frontend middleware too late.
    // Remove this preloader after upgrading to an image with the upstream fix.
    const core = require('@nestjs/core');
    const express = require('express');

    const originalCreate = core.NestFactory.create;

    core.NestFactory.create = async function (...args) {
      const app = await originalCreate.apply(this, args);
      const { FrontendService } = require(
        '/app/packages/twenty-server/dist/engine/core-modules/frontend/frontend.service',
      );
      const frontendService = app.get(FrontendService, { strict: false });

      if (!frontendService.isEnabled) {
        return app;
      }

      const serveStatic = express.static(frontendService.frontPath, {
        index: false,
        redirect: false,
        setHeaders: (response, filePath) => {
          if (filePath.toLowerCase().endsWith('.html')) {
            response.setHeader('Cache-Control', 'no-store');
            response.setHeader('CDN-Cache-Control', 'no-store');
            response.setHeader('Cloudflare-CDN-Cache-Control', 'no-store');
            response.setHeader('Content-Security-Policy', "frame-ancestors 'none'");
            response.setHeader('X-Frame-Options', 'DENY');
          }
        },
      });

      app.use((request, response, next) => {
        if (request.path === '/index.html') {
          return next();
        }
        return serveStatic(request, response, next);
      });
      app.use(frontendService.serveDocument.bind(frontendService));

      return app;
    };
