---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Harbor webhook signing token, mirrored from 1Password item `flux`
# (field HARBOR_WEBHOOK_TOKEN_OPENCLAW, also set as the webhook auth header in Harbor).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-webhook-token-openclaw
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harbor-webhook-token-openclaw
    creationPolicy: Owner
    template:
      data:
        token: "{{ .HARBOR_WEBHOOK_TOKEN_OPENCLAW }}"
  dataFrom:
    - extract:
        key: flux
