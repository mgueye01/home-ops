---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Pull-only Harbor robot used by Kyverno to read cosign signatures (1Password item `harbor`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-kyverno
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harbor-kyverno
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.g-eye.io": {
                "username": "{{ .KYVERNO_HARBOR_USER }}",
                "password": "{{ .KYVERNO_HARBOR_PASS }}",
                "auth": "{{ printf "%s:%s" .KYVERNO_HARBOR_USER .KYVERNO_HARBOR_PASS | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: harbor
