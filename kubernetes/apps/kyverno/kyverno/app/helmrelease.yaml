---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  chartRef:
    kind: OCIRepository
    name: kyverno
  interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Harbor pull-only robot (robot$kyverno, openclaw + elgato) so the controllers can
    # fetch cosign signatures from the private openclaw project. Sets --imagePullSecrets.
    existingImagePullSecrets:
      - harbor-kyverno
    admissionController:
      replicas: 1
      container:
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
    backgroundController:
      replicas: 1
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
    reportsController:
      replicas: 1
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
    cleanupController:
      replicas: 1
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 128Mi}
