---
# Source: eol-maintenance/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eol-maintenance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: eol-maintenance
  policyTypes: [Ingress, Egress]

---
# Source: eol-maintenance/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eol-maintenance
automountServiceAccountToken: false

---
# Source: eol-maintenance/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eol-maintenance-reports
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "ceph-block"
  resources:
    requests:
      storage: "1Gi"

---
# Source: eol-maintenance/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eol-maintenance
spec:
  schedule: "17 4 * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: eol-maintenance
        spec:
          serviceAccountName: eol-maintenance
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watcher
              image: "ghcr.io/mgueye01/kubernetes-eol-agentic-maintenance@sha256:b3e4b3948a1cfbbbc9e7d306393099fcf1be90d03bfe305bc553d6778f4d295a"
              args:
                - watch
                - --run-id
                - $(JOB_UID)
                - --output
                - /reports
              volumeMounts:
                - {name: reports, mountPath: /reports}
              env:
                - name: JOB_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
                - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: "eol-maintenance-reports"
