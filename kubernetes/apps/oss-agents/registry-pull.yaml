apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: watcher-ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: watcher-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  dataFrom:
    - extract:
        key: watcher-ghcr-pull
