apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oss-agents
resources:
  - namespace.yaml
  - watcher.helm.yaml
  - namespace-policies.yaml
  - egress.yaml
  - registry-pull.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: eol-maintenance-reports
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
        value: disabled
  - target:
      kind: CronJob
      name: eol-maintenance
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
        value: [{name: watcher-ghcr-pull}]
      - op: add
        path: /spec/jobTemplate/spec/template/spec/dnsConfig
        value: {options: [{name: ndots, value: "1"}]}
