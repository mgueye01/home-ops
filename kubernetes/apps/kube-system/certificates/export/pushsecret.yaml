---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: g-eye-io-tls
spec:
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: g-eye-io-tls
  # One item update avoids stale-version conflicts between consecutive fields.
  template:
    data:
      bundle: '{{ dict "tls.crt" (index . "tls.crt" | b64enc) "tls.key" (index . "tls.key" | b64enc) | toJson }}'
  data:
    - match:
        secretKey: bundle
        remoteRef:
          remoteKey: g-eye-io-tls
          property: tls.bundle
