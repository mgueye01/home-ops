---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gatus-secret
    template:
      engineVersion: v2
      data:
        # Pre-computed HTTP Basic credential for the rybbit-ingest check in
        # resources/config.yaml. gatus has no basic-auth field of its own, so the
        # header value is assembled here and referenced as
        # ${RYBBIT_CLICKHOUSE_BASIC_AUTH} -- the password itself never appears in
        # a manifest. Same idiom as apps/kyverno/kyverno (harbor dockerconfig).
        #
        # The ClickHouse HTTP interface also accepts X-ClickHouse-User /
        # X-ClickHouse-Key, but that pair was verified to fail against this
        # instance (HTTP 401, REQUIRED_PASSWORD) while Basic succeeds -- the
        # generated password contains bytes that do not survive as a header
        # value. Do not "simplify" this back to the X-ClickHouse-* headers.
        RYBBIT_CLICKHOUSE_BASIC_AUTH: "{{ printf \"default:%s\" .RYBBIT_CLICKHOUSE_PASSWORD | b64enc }}"
  dataFrom:
    - extract:
        key: rybbit
